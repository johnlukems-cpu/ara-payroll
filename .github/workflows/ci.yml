name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ara
          POSTGRES_PASSWORD: ara
          POSTGRES_DB: ara_payroll
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ara" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ara:ara@localhost:5432/ara_payroll
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run db:demo
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
